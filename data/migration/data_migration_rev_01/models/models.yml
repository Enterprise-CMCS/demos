              arguments:
                to: source('demos_app', 'deliverable_status')
                field: id
      - name: cms_owner_user_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_owner_ids_in_final_deliv_table
          - relationships:
              name: assert_relationship_owner_in_final_deliv_table
              arguments:
                to: source('demos_app', 'users')
                field: id
      - name: cms_owner_person_type_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_owner_person_type_in_final_deliv_table
          - relationships:
