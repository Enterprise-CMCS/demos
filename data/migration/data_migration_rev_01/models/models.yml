      - name: expected_to_be_submitted
        data_type: boolean
        data_tests:
          - not_null:
              name: assert_no_missing_expected_to_be_submitted_in_final_deliv_table
      - name: created_at
        data_type: timestamptz
        data_tests:
          - not_null:
              name: assert_no_missing_created_at_in_final_deliv_table
      - name: updated_at
        data_type: timestamptz
        data_tests:
          - not_null:
