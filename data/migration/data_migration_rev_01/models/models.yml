version: 2

models:
  # Final Models
  - name: final_demos_app_extension
    columns:
      - name: id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_id_in_final_extension_table
      - name: application_type_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_application_type_id_in_final_extension_table
          - relationships:
              name: assert_application_type_id_exists_in_demos_app_application_type
              arguments:
                to: source('demos_app', 'application_type')
                field: id
      - name: demonstration_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_demonstration_id_in_final_extension_table
          - relationships:
              name: assert_demonstration_id_exists_in_demos_app_demonstration
              arguments:
                to: source('legacy_pmda_staged', 'final_demos_app_demonstration')
                field: id
      - name: demonstration_status_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_demonstration_status_id_in_final_extension_table
          - relationships:
              name: assert_demonstration_status_id_exists_in_demos_app_application_status
              arguments:
                to: source('demos_app', 'application_status')
                field: id
      - name: name
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_name_in_final_extension_table
      - name: description
        data_type: text
      - name: effective_date
        data_type: timestamptz
      - name: status_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_status_id_in_final_extension_table
          - relationships:
              name: assert_status_id_exists_in_demos_app_application_status
              arguments:
                to: source('demos_app', 'application_status')
                field: id
      - name: status_updated_at
        data_type: timestamptz
        data_tests:
          - not_null:
              name: assert_no_missing_status_updated_at_in_final_extension_table
      - name: current_phase_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_current_phase_id_in_final_extension_table
          - relationships:
              name: assert_current_phase_id_exists_in_demos_app_phase
              arguments:
                to: source('demos_app', 'phase')
                field: id
      - name: clearance_level_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_clearance_level_id_in_final_extension_table
          - relationships:
              name: assert_clearance_level_id_exists_in_demos_app_clearance_level
              arguments:
                to: source('demos_app', 'clearance_level')
                field: id
      - name: signature_level_id
        data_type: text
        data_tests:
          - accepted_values:
              name: assert_signature_level_id_is_valid_in_final_extension_table
              arguments:
                values:
                  - "OA"
                  - "OCD"
      - name: created_at
        data_type: timestamptz
        data_tests:
          - not_null:
              name: assert_no_missing_created_at_in_final_extension_table
      - name: updated_at
        data_type: timestamptz
        data_tests:
          - not_null:
              name: assert_no_missing_updated_at_in_final_extension_table
      - name: _legacy_mdcd_demo_rnwl_id
        data_type: integer
      - name: _legacy_mdcd_pendg_demo_id
        data_type: integer
        data_tests:
          - unique:
              name: assert_legacy_mdcd_pendg_demo_id_is_unique_in_final_extension_table
      - name: _legacy_mdcd_demo_aplctn_id
        data_type: integer
        data_tests:
          - unique:
              name: assert_legacy_mdcd_demo_aplctn_id_is_unique_in_final_extension_table

  - name: final_demos_app_application_date
    columns:
      - name: application_id
        data_type: uuid
      - name: date_type_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_application_date_type_exists_in_final_demos_app_date_type
              arguments:
                to: source('demos_app', 'date_type')
                field: id
      - name: date_value
        data_type: timestamptz
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz
      - name: is_migrated_from_pmda
        data_type: boolean
        data_tests:
          - accepted_values:
              name: assert_is_migrated_from_pmda_is_true_in_final_dates_table
              arguments:
                values:
                  - TRUE

  - name: final_demos_app_application_phase
    columns:
      - name: application_id
        data_type: uuid
      - name: phase_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_application_phase_phase_exists_in_demos_app_phase
              arguments:
                to: source('demos_app', 'phase')
                field: id
      - name: phase_status_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_application_phase_phase_status_exists_in_demos_app_phase_status
              arguments:
                to: source('demos_app', 'phase_status')
                field: id
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz

  - name: final_demos_app_application
    columns:
      - name: id
        data_type: uuid
      - name: application_type_id
        data_type: text
      - name: _legacy_mdcd_demo_id
        data_type: integer
      - name: _legacy_mdcd_pendg_demo_id
        data_type: integer
      - name: is_migrated_from_pmda
        data_type: boolean
        data_tests:
          - accepted_values:
              name: assert_is_migrated_from_pmda_is_true_in_final_application_table
              arguments:
                values:
                  - TRUE

  - name: final_demos_app_application_tag_assignment
    columns:
      - name: application_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_application_id_in_final_demos_app_application_tag_assignment
          - relationships:
              name: assert_application_id_exists_in_final_demos_app_application
              arguments:
                to: ref('final_demos_app_application')
                field: id
      - name: tag_name_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_tag_name_id_in_final_demos_app_application_tag_assignment
          - relationships:
              name: assert_application_tag_assignment_tag_name_id_exists_in_cleaned_demos_app_tag_name
              arguments:
                to: source('legacy_pmda_staged', 'cleaned_demos_app_tag_name')
                field: id
      - name: tag_type_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_tag_type_id_in_final_demos_app_application_tag_assignment
          - relationships:
              name: assert_tag_type_id_exists_in_demos_app_tag_type
              arguments:
                to: source('demos_app', 'application_tag_type_limit')
                field: id

  - name: final_demos_app_document
    columns:
      - name: id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_id_in_final_docs_table
          - unique:
              name: assert_id_is_unique_in_final_docs_table
      - name: name
        data_type: text
      - name: description
        data_type: text
      - name: s3_path
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_s3_path_in_final_docs_table
          - unique:
              name: assert_s3_path_is_unique_in_final_docs_table
      - name: owner_user_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_null_owners_in_final_docs_table
          - relationships:
              name: assert_document_owner_user_exists_in_user
              arguments:
                to: source('legacy_pmda_staged', 'final_demos_app_users')
                field: id
      - name: document_type_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_null_document_types_in_final_docs_table
          - relationships:
              name: assert_all_document_types_in_final_docs_table_exist_in_demos_app_doc_type
              arguments:
                to: source('demos_app', 'document_type')
                field: id
      - name: application_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_null_app_ids_in_final_docs_table
          - relationships:
              name: assert_document_application_id_exists_in_application
              arguments:
                to: ref('final_demos_app_application')
                field: id
      - name: phase_id
        data_type: text
        # The phase_id is nullable because some document types are not associated with a specific phase.
        data_tests:
          - relationships:
              name: assert_document_phase_id_exists_in_demos_app_phase
              arguments:
                to: source('demos_app', 'phase')
                field: id
      - name: deliverable_id
        data_type: uuid
        # deliverable_id is null when documents are attached directly to the demonstration
        data_tests:
          - relationships:
              name: assert_document_deliverable_id_exists_in_deliverable
              arguments:
                to: source('legacy_pmda_staged', 'final_demos_app_deliverable')
                field: id
        # deliverable_type_id is null when documents are attached directly to the demonstration
      - name: deliverable_type_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_document_deliverable_type_id_exists_in_deliverable_type
              arguments:
                to: source('demos_app', 'deliverable_type')
                field: id
      - name: deliverable_is_cms_attached_file
        data_type: boolean
      - name: deliverable_submission_action_id
        data_type: uuid
      - name: deliverable_submission_action_type_id
        data_type: text
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz
      - name: _legacy_mdcd_dlvrbl_fil_doc_id
        data_type: integer
      - name: _legacy_mdcd_dlvrbl_id
        data_type: integer
      - name: _legacy_mdcd_demo_aplctn_doc_rpstry_dtl_id
        data_type: integer
      - name: _legacy_mdcd_demo_pgm_mntrg_doc_id
        data_type: integer
      - name: _internal_pmda_s3_file_id
        data_type: bigint
        data_tests:
          - unique:
              name: assert_internal_pmda_s3_file_id_unique_in_final_docs
          - not_null:
              name: assert_internal_pmda_s3_file_id_not_null_in_final_docs
      - name: _internal_submission_id
        data_type: bigint
      - name: is_migrated_from_pmda
        data_type: boolean
        data_tests:
          - accepted_values:
              name: assert_is_migrated_from_pmda_is_true_in_final_docs_table
              arguments:
                values:
                  - TRUE

  # Application models
  - name: cleaned_demos_app_app_phases_in_prog_demos
    columns:
      - name: application_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_id_not_null_in_cleaned_demos_app_app_phases_in_prog_demos

      - name: phase_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_application_phase_phase_exists_in_demos_app_phase
              arguments:
                to: source('demos_app', 'phase')
                field: id
      - name: phase_status_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_application_phase_phase_status_exists_in_demos_app_phase_status
              arguments:
                to: source('demos_app', 'phase_status')
                field: id
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz

  - name: cleaned_demos_app_application_date_in_prog_demos
    columns:
      - name: application_id
        data_type: uuid
      - name: date_type_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_application_date_type_exists_in_demos_app_date_type
              arguments:
                to: source('demos_app', 'date_type')
                field: id
      - name: date_value
        data_type: timestamptz
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz

  - name: cleaned_demos_app_finalized_extension
    columns:
      - name: status_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_status_id_in_cleaned_finalized_extension
          - accepted_values:
              name: assert_status_id_is_approved_in_cleaned_finalized_extension
              arguments:
                values:
                  - Approved
      - name: signature_level_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_signature_level_id_in_cleaned_finalized_extension
      - name: effective_date
        data_type: timestamptz
        data_tests:
          - not_null:
              name: assert_no_missing_effective_date_in_cleaned_finalized_extension

  - name: apps_in_prog_dates_crosswalked
    description: converts the dates stored in PMDA to applicable date types in DEMOS, extrapolating to phase start and end dates where needed.

  - name: apps_in_prog_dates_with_checks
    description: validates the dates using validation rules found in the DEMOS API. Flags failing dates with a reason.

  - name: cleaned_demos_app_in_prog_extension_current_phase
    columns:
      - name: current_phase_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_current_phase_id_in_cleaned_in_prog_extension_current_phase
          - relationships:
              name: assert_current_phase_id_exists_in_demos_app_phase
              arguments:
                to: source('demos_app', 'phase')
                field: id

  # Document Models
  - name: docs_pmda_app_docs_rpstry
    columns:
      - name: _legacy_mdcd_demo_aplctn_doc_rpstry_dtl_id
        data_type: integer
        data_tests:
          - unique:
              name: assert_no_duplicate_app_doc_rpstry_dtl_ids_in_rpstry
      - name: _legacy_mdcd_demo_aplctn_doc_rpstry_fil_id
        data_type: integer
        data_tests:
          - unique:
              name: assert_no_duplicate_app_doc_rpstry_fil_ids_in_rpstry