version: 2

models:
  - name: cleaned_demos_app_system_role_assignment
    description: default system role assignmend derived from idm role
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: assert_system_role_assignment_is_unique
          arguments:
            combination_of_columns:
              - person_id
              - role_id
    columns:
      - name: person_id
        data_type: uuid
        data_tests:
          - relationships:
              name: assert_system_role_assignment_person_exists_in_person
              arguments:
                to: ref('cleaned_demos_app_person')
                field: id
      - name: role_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_system_role_assignment_role_exists_in_demos_app_system_role
              arguments:
                to: source('demos_app', 'role')
                field: id
      - name: person_type_id
        data_tests:
          - relationships:
              name: assert_system_role_assignment_person_type_exists_in_demos_app_person_type
              arguments:
                to: source('demos_app', 'person_type')
                field: id
        data_type: text
      - name: grant_level_id
        data_type: text
        data_tests:
          - accepted_values:
              name: assert_system_role_assignment_grant_level_id_is_system
              arguments:
                values:
                  - System

  - name: users_cleaned_demos_app_person_state_user
    description: All cleaned people records that are of type demos-state-user
    columns:
      - name: person_type_id
        data_tests:
          - accepted_values:
              name: assert_person_type_id_is_demos_state_user_in_users_cleaned_demos_app_person_state_user
              arguments:
                values:
                  - demos-state-user

  - name: cleaned_demos_app_person_state
    description: All cleaned person-state relations with state users and valid states
    config:
      contract:
        enforced: true
    columns:
      - name: person_id
        data_type: uuid
        data_tests:
          - relationships:
              name: assert_person_state_person_exists_in_person
              arguments:
                to: ref('cleaned_demos_app_person')
                field: id
      - name: _legacy_id
        data_type: integer
      - name: _person_type_id
        data_type: text
      - name: state_id
        data_type: text
        data_tests:
          - relationships:
              name: assert_person_state_state_exists_in_demos_app_state
              arguments:
                to: source('demos_app', 'state')
                field: id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: assert_person_state_is_unique
          arguments:
            combination_of_columns:
              - person_id
              - state_id

  - name: cleaned_demos_app_demonstration_role_assignment
    description: Demonstration role assignments prepared from PMDA role slots. Demonstration UUID resolution is deferred, so this model carries _legacy_mdcd_demo_id until the direct demonstration migration is wired in.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: assert_demonstration_role_assignment_is_unique
          arguments:
            combination_of_columns:
              - person_id
              - _legacy_mdcd_demo_id
              - role_id
      - dbt_utils.expression_is_true:
          name: assert_demonstration_role_assignment_person_state_pair_exists
          arguments:
            expression: "person_type_id <> 'demos-state-user' or exists (select 1 from {{ ref('cleaned_demos_app_person_state') }} cps where cps.person_id = person_id and cps.state_id = state_id)"
      - dbt_utils.expression_is_true:
          name: assert_demonstration_role_assignment_person_person_type_pair_exists
          arguments:
            expression: "exists (select 1 from {{ ref('cleaned_demos_app_person') }} cp where cp.id = person_id and cp.person_type_id = person_type_id)"
      - dbt_utils.expression_is_true:
          name: assert_demonstration_role_assignment_role_person_type_pair_exists
          arguments:
            expression: "exists (select 1 from {{ source('demos_app', 'role_person_type') }} rpt where rpt.role_id = role_id and rpt.person_type_id = person_type_id)"
      - dbt_utils.expression_is_true:
          name: assert_demonstration_role_assignment_role_grant_level_pair_exists
          arguments:
            expression: "exists (select 1 from {{ source('demos_app', 'role') }} r where r.id = role_id and r.grant_level_id = grant_level_id)"
    columns:
      - name: person_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_person_id_in_demonstration_role_assignment
          - relationships:
              name: assert_demonstration_role_assignment_person_exists_in_person
              arguments:
                to: ref('cleaned_demos_app_person')
                field: id
      - name: _legacy_mdcd_demo_id
        data_type: integer
        data_tests:
          - not_null:
              name: assert_no_missing_legacy_demonstration_id_in_demonstration_role_assignment
      - name: role_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_role_id_in_demonstration_role_assignment
          - relationships:
              name: assert_demonstration_role_assignment_role_exists_in_demos_app_role
              arguments:
                to: source('demos_app', 'role')
                field: id
      - name: state_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_state_id_in_demonstration_role_assignment
          - relationships:
              name: assert_demonstration_role_assignment_state_exists_in_demos_app_state
              arguments:
                to: source('demos_app', 'state')
                field: id
      - name: person_type_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_person_type_id_in_demonstration_role_assignment
          - relationships:
              name: assert_demonstration_role_assignment_person_type_exists_in_demos_app_person_type
              arguments:
                to: source('demos_app', 'person_type')
                field: id
      - name: grant_level_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_grant_level_id_in_demonstration_role_assignment
          - accepted_values:
              name: assert_demonstration_role_assignment_grant_level_is_demonstration
              arguments:
                values:
                  - Demonstration
          - relationships:
              name: assert_demonstration_role_assignment_grant_level_exists_in_demonstration_grant_level_limit
              arguments:
                to: source('demos_app', 'demonstration_grant_level_limit')
                field: id

  - name: cleaned_demos_app_primary_demonstration_role_assignment
    description: Primary Project Officer rows prepared from PMDA role slots. Demonstration UUID resolution is deferred, so this model carries _legacy_mdcd_demo_id until the direct demonstration migration is wired in.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: assert_primary_demonstration_role_assignment_is_unique
          arguments:
            combination_of_columns:
              - _legacy_mdcd_demo_id
              - role_id
      - dbt_utils.unique_combination_of_columns:
          name: assert_primary_demonstration_role_assignment_person_demo_role_is_unique
          arguments:
            combination_of_columns:
              - person_id
              - _legacy_mdcd_demo_id
              - role_id
      - dbt_utils.expression_is_true:
          name: assert_primary_demonstration_role_assignment_exists_in_demonstration_role_assignment
          arguments:
            expression: "exists (select 1 from {{ ref('cleaned_demos_app_demonstration_role_assignment') }} dra where dra.person_id = person_id and dra._legacy_mdcd_demo_id = _legacy_mdcd_demo_id and dra.role_id = role_id)"
    columns:
      - name: person_id
        data_type: uuid
        data_tests:
          - not_null:
              name: assert_no_missing_person_id_in_primary_demonstration_role_assignment
          - relationships:
              name: assert_primary_demonstration_role_assignment_person_exists_in_person
              arguments:
                to: ref('cleaned_demos_app_person')
                field: id
      - name: _legacy_mdcd_demo_id
        data_type: integer
        data_tests:
          - not_null:
              name: assert_no_missing_legacy_demonstration_id_in_primary_demonstration_role_assignment
      - name: role_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_no_missing_role_id_in_primary_demonstration_role_assignment
          - relationships:
              name: assert_primary_demonstration_role_assignment_role_exists_in_demos_app_role
              arguments:
                to: source('demos_app', 'role')
                field: id

  - name: users_active_pmda_users
    columns:
      - name: id
        data_tests:
          - unique:
              name: assert_pmda_user_id_is_unique

  - name: cleaned_demos_app_person
    config:
      contract:
        enforced: true
    description: This is the cleaned data from PMDA prepared for insert into demos_app.person. Users were initially selected from the `users` table in PMDA where the `active` flag was set to 1.
    columns:
      - name: id
        data_type: uuid
      - name: person_type_id
        data_type: text
        description: In cases where a PMDA set of roles resolves to more than one DEMOS person_type_id, the highest person_type_id was chosen. If no person type could be generated, the user is filtered out.
        data_tests:
          - not_null:
              name: assert_no_missing_person_type_id_in_cleaned_demos_app_person
      - name: email
        data_type: text
        description: Users with missing email addresses are filtered out, as are those with empty string or not passing basic format checking.
        data_tests:
          - not_null:
              name: assert_no_missing_email_in_cleaned_demos_app_person
      - name: first_name
        data_type: text
        description: Users with missing first names are filtered out.
        data_tests:
          - not_null:
              name: assert_no_missing_first_name_in_cleaned_demos_app_person
      - name: last_name
        data_type: text
        description: Users with missing last names are filtered out.
        data_tests:
          - not_null:
              name: assert_no_missing_last_name_in_cleaned_demos_app_person
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz
      - name: _legacy_id
        data_type: integer

  - name: cleaned_demos_app_users
    config:
      contract:
        enforced: true
    description: This is the cleaned data from PMDA prepared for insert into demos_app.users; this is derived entirely from `cleaned_demos_app_person`.
    data_tests:
      - dbt_utils.expression_is_true:
          name: assert_cognito_subject_always_null_in_cleaned_demos_app_users
          arguments:
            expression: "cognito_subject IS NULL"
      - dbt_utils.expression_is_true:
          name: assert_username_always_null_in_cleaned_demos_app_users
          arguments:
            expression: "username IS NULL"
      - dbt_utils.expression_is_true:
          name: assert_is_migrated_from_pmda_always_true_in_cleaned_demos_app_users
          arguments:
            expression: "is_migrated_from_pmda = TRUE"
      - dbt_utils.expression_is_true:
          name: assert_has_logged_in_always_false_in_cleaned_demos_app_users
          arguments:
            expression: "has_logged_in = FALSE"
    columns:
      - name: id
        data_type: uuid
      - name: person_type_id
        data_type: text
        data_tests:
          - not_null:
              name: assert_person_type_id_not_null_in_cleaned_demos_app_users
          - relationships:
              name: assert_person_type_id_in_allowed_user_types_in_cleaned_demos_app_users
              arguments:
                to: source('demos_app', 'user_person_type_limit')
                field: id
      - name: cognito_subject
        data_type: uuid
      - name: username
        data_type: text
      - name: is_migrated_from_pmda
        data_type: boolean
      - name: has_logged_in
        data_type: boolean
      - name: created_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz
