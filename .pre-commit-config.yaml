repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: no-commit-to-branch
      - id: check-case-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    - id: detect-secrets
      args: ['--baseline', '.secrets.baseline']
      exclude: '(data-migration/reports/prisma_ddl\.manifest\.json|data-migration/reports/prisma_(ddl|schema)_source\.txt|data/migration/stage_pmda_for_migration/package-lock\.yml)'

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.6
    hooks:
    - id: pydoclint
      args: ["--config=data/demos-data-tools/pyproject.toml"]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        files: ^data/migration/stage_pmda_for_migration/

  # data-migration/ needs pg_format and a front-matter check alongside
  # sqlfluff, and all three must run with data-migration as the working
  # directory. See data-migration/scripts/precommit_sql.sh for why.
  - repo: local
    hooks:
      - id: data-migration-sql
        name: data-migration SQL (pg_format, sqlfluff, front-matter)
        entry: data-migration/scripts/precommit_sql.sh
        language: script
        files: ^data-migration/.*\.sql$
        pass_filenames: true
        stages: [pre-commit]
