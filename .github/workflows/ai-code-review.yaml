name: AI Code Review
on:
  pull_request:
    types: 
      - opened
      - edited
      - reopened
      - ready_for_review
  workflow_dispatch:
  issue_comment:
    types: 
      - created
      - edited

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    if: >-
      vars.PR_AGENT_DISABLED != 'true' &&
      github.event.sender.type != 'Bot' &&
      !github.event.pull_request.draft &&
      (
        (
          github.event_name == 'pull_request' && 
          (
            contains(github.event.pull_request.body || '', '- [x] Run AI Code Review') ||
            contains(github.event.pull_request.body || '', '- [X] Run AI Code Review')
          ) &&
          (
            github.event.action != 'edited' ||
            (
              !contains(github.event.changes.body.from || '', '- [x] Run AI Code Review') &&
              !contains(github.event.changes.body.from || '', '- [X] Run AI Code Review')
            )
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          contains(
            fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.comment.author_association
          )
        )
      )
    permissions:
      issues: write
      pull-requests: write
      contents: read
      checks: write
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Run AI Code Review
        uses: the-pr-agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_USE_IMDS: "true"
          AWS_REGION_NAME: ${{ secrets.AWS_DEFAULT_REGION }}
          config.model_weak: "bedrock/us.amazon.nova-2-lite-v1:0"
          config.model: "bedrock/us.anthropic.claude-sonnet-4-6"
          config.fallback_models: '["bedrock/us.amazon.nova-pro-v1:0"]'
          config.persistent_inline_comments: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          config.custom_model_max_tokens: "128000"
          config.enable_claude_extended_thinking: "true"
          config.extended_thinking_budget_tokens: "8192"
          config.extended_thinking_max_output_tokens: "12288"
          config.repo_context_files: '["AGENTS.md", "client/AGENTS.md", "server/AGENTS.md", "deployment/AGENTS.md", "data-migration/AGENTS.md", "lambdas/AGENTS.md"]'
          pr_reviewer.extra_instructions: |
            Report only concrete correctness, security, compatibility, or test-coverage
            problems introduced by this PR. Do not suggest cosmetic refactors, comments,
            documentation, naming changes, or speculative defensive checks. Before raising
            a finding, verify that it follows from the supplied diff and repository context.
          pr_reviewer.num_max_findings: '5'
          pr_reviewer.enable_large_pr_chunking: 'true'
          pr_reviewer.require_merge_recommendation: 'true'
          pr_code_suggestions.extra_instructions: |
            Report only concrete correctness, security, compatibility, or test-coverage
            problems introduced by this PR. Every suggestion must identify a specific
            failure scenario supported by the diff and repository context. Do not suggest
            cosmetic refactors, comments, documentation, naming changes, speculative
            defensive checks, or merely ask whether intentional behavior is intentional.
            If there is insufficient evidence that the code is wrong, omit the suggestion.
          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_code_suggestions.suggestions_score_threshold: "7"
