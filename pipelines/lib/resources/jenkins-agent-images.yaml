# This pod template is used to support pod template creation though the podSpec
# library function
#
# The containers listed here are not automatically included in the final pod
# spec, they are used to configure presets and a final pod spec is created based
# on selections made in the pipelines. This file is only formatted as a valid
# pod spec so that dependabot can manage version updates
apiVersion: v1
kind: Pod
metadata:
  name: demos-jenkins-agent
  labels:
    jenkins: "agent"
spec:
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 5Gi
    - name: home
      emptyDir:
        sizeLimit: 1Gi
  nodeSelector:
    node-pool: "agent"
  restartPolicy: Never
  serviceAccountName: jenkins-role
  containers:
    - name: default
      image: alpine
      command: 
        - cat
      tty: true
      resources:
        requests:
          cpu: 250m
          memory: 500Mi
          ephemeral-storage: 2Gi
        limits:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 10Gi
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: 
          - ALL
    - name: node
      image: node:24.22.3-alpine
      command: 
        - cat
      tty: true
      resources:
        requests:
          cpu: 750m
          memory: 1Gi
          ephemeral-storage: 2Gi
        limits:
          cpu: 1500m
          memory: 2Gi
          ephemeral-storage: 10Gi
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: 
          - ALL
    - name: aws-cli
      image: amazon/aws-cli:2.40.3
      command:
        - sleep
        - '99999'
      tty: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
          ephemeral-storage: "1Gi"
        limits:
          cpu: 400m
          memory: 512Mi
          ephemeral-storage: "5Gi"
      imagePullPolicy: Always
      env:
        - name: HOME
          value: /tmpHome
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /tmpHome
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: 
          - ALL
    - name: snyk
      image: snyk/snyk:alpine # snyk doesn't publish versions
      command:
      - cat
      tty: true
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: "1Gi"
        limits:
          cpu: 2000m
          memory: 2Gi
          ephemeral-storage: "5Gi"
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: 
          - ALL
    - name: zap
      image: zaproxy/zap-stable:20260807
      command:
      - cat
      tty: true
      resources:
        requests:
          cpu: 1500m
          memory: 2Gi
          ephemeral-storage: "1Gi"
        limits:
          cpu: 3000m
          memory: 4Gi
          ephemeral-storage: "5Gi"
      imagePullPolicy: Always
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/zap/.ZAP
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: 
          - ALL
    - name: checkov
      image: bridgecrew/checkov:3.4.5
      command:
      - cat
      tty: true
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
          ephemeral-storage: "1Gi"
        limits:
          cpu: 2000m
          memory: 2Gi
          ephemeral-storage: "5Gi"
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: 
          - ALL
